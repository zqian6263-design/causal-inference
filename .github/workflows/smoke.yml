name: smoke

# 批次 D 冒烟 CI：ubuntu + python 3.9 装 requirements.txt 后跑全部实验脚本，
# 验证仓库「新鲜 clone + pip install」即可复现（对应 PLAN 全局验收标准 1）。
# F1 批次：新增 E1 比较脚本（discrete_cpd/sensitivity，确定性小图，~2 分钟内），
# 模板独立验收换成 tests/test_template_portable.py（覆盖更强）；timeout 20→35 留足。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install deps
        run: pip install -r requirements.txt

      # 逐方法实验脚本（08_benchmarks 需外部 bnlearn 数据，不进 CI，见其 README）
      - name: 00_env_check
        run: python experiments/00_env_check.py
      - name: 01_pc
        run: python experiments/01_pc/run.py
      - name: 02_fci
        run: python experiments/02_fci/run.py
      - name: 02_fci_cdnod
        run: python experiments/02_fci/cdnod_example.py
      - name: 03_ges_dges
        run: python experiments/03_ges_dges/run.py
      - name: 04_lingam_anm_pnl
        # PNL 依赖 torch（causal-learn 不强依赖，requirements 未含）→ 脚本自动跳过 PNL 示例
        run: python experiments/04_lingam_anm_pnl/run.py
      - name: 05_gin_rlcd
        run: python experiments/05_gin_rlcd/run.py
      - name: 06_grasp_boss
        run: python experiments/06_grasp_boss/run.py
      - name: 07_granger
        run: python experiments/07_granger/run.py
      - name: 09_comparison
        run: python experiments/09_comparison/run_all.py
      # F1 新增：E1 比较脚本（确定性、5 节点小图、无外部数据，~30s 与 ~2 分钟）
      - name: 09 comparison discrete_cpd (IMP#1 复核)
        run: python experiments/09_comparison/discrete_cpd.py
      - name: 09 comparison sensitivity (IMP#4 样本量扫描)
        run: python experiments/09_comparison/sensitivity.py

      # 模板「复制即用」回归（E2 固化）：独立临时目录跑 template_data_gen/pipeline + 定量评估分支
      - name: template portable regression
        run: python tests/test_template_portable.py

      # 08_benchmarks（smoke_asia/run_all_bnlearn）需外部 bnlearn 数据（causal-learn TestData），
      # CI 无法访问 → 不进本工作流，见 experiments/08_benchmarks/README.md 获取方式。
